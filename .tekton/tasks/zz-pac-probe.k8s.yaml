apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: pac-probe
spec:
  params:
    - {name: repo-full-name, type: string}
    - {name: revision, type: string}
  steps:
    - name: probe
      image: ghcr.io/pfenerty/apko-cicd/base:stable
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
      env:
        - name: PROBE_TOKEN
          valueFrom:
            secretKeyRef:
              name: "{{ git_auth_secret }}"
              key: git-provider-token
        - name: PROBE_LITERAL
          value: "{{ revision }}"
      script: |
        #!/usr/bin/env nu
        print $"literal placeholder became: ($env.PROBE_LITERAL)"
        print $"token length: ($env.PROBE_TOKEN | str length)"
        let url = "https://api.github.com/repos/$(params.repo-full-name)/check-runs"
        let r = (http post $url {name: "pac-probe", head_sha: "$(params.revision)", status: "completed", conclusion: "neutral", output: {title: "PAC placeholder probe", summary: "Token came from {{ git_auth_secret }} inside a task file."}} -t application/json -H [Authorization $"Bearer ($env.PROBE_TOKEN)" Accept "application/vnd.github+json"])
        print $"created check run ($r.id), app: ($r.app.slug)"
